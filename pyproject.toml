[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uplift-targeting-engine"
version = "0.1.0"
description = "Pick which customers get a voucher: uplift modelling on the Criteo Uplift dataset, with honest evaluation, MLflow tracking, a scoring API and a budget simulator."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Duan Nguyen" }]
dependencies = [
    "numpy>=2.0",
    "pandas>=2.1",
    "polars>=1.0",
    "pyarrow>=15",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "joblib>=1.3",
]

[project.optional-dependencies]
track = ["mlflow>=2.12"]
serve = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.6"]
app = ["streamlit>=1.33", "altair>=5"]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "httpx>=0.27",
    "fastapi>=0.110",
    "pydantic>=2.6",
]

[project.scripts]
ute = "ute.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
